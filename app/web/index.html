// P(capture)/Sum capture% are only accurate wording when the chart's own success criteria
// IS "captured" — a chart built around a different criteria (survived-turns-without-fleeing,
// balls-no-flee, ...) is scoring something else entirely, so the generic "success" wording
// applies instead. Falls back to "capture" phrasing if the chart can't be resolved (better
// than showing nothing).
// Find Target (ct) and Manage Data (cmd) are separate page states, and only one of them is
// populated at a time — Manage Data can examine a saved target without Find Target ever having
// been opened, which used to throw here on a null `ct` (round 17 feedback). Look in whichever
// page state actually has the charts.
function _chartIsCapture(chartId){
  const charts = (typeof ct !== "undefined" && ct?.charts)
    || (typeof cmd !== "undefined" && cmd?.charts) || [];
  const chart = charts.find(c => c.id === chartId);
  return !chart || chart.criteria_name === "capture";
}
function _pLabel(chartId){ return _chartIsCapture(chartId) ? "P(capture)" : "P(success)"; }
function _sumLabel(chartId){ return _chartIsCapture(chartId) ? "Sum capture%" : "Sum success%"; }

function cmdOpenFindTarget(chartId){
  chartFindTarget(cmd.expId).then(() => { ct.chartId = chartId; ctSelectChart(chartId); });
}

async function cmdDeleteCanon(chartId){
  if(!confirm("Delete this chart's computed data? It can be recomputed later, but the next " +
    "compute will be a full one instead of an incremental extend.")) return;
  await api("chart_delete_canon", cmd.expId, chartId);
  cmd.canonStatus[chartId] = await api("chart_canon_status", cmd.expId, chartId);
  renderChartManageData();
}

async function cmdDeleteChart(chartId){
  const hasTargets = cmd.targets.some(t => t.chart_id === chartId);
  const msg = hasTargets
    ? "Delete this chart? Its computed data on disk is left in place (delete it separately if " +
      "you also want that gone), but targets saved from it will lose their chart link."
    : "Delete this chart?";
  if(!confirm(msg)) return;
  await api("delete_chart", chartId);
  cmd.charts = cmd.charts.filter(c => c.id !== chartId);
  delete cmd.canonStatus[chartId];
  renderChartManageData();
}

async function cmdExamineTarget(targetId){
  // Carry the target's OWN chart id, so the P(capture)/P(success) wording matches the chart
  // it was ranked from rather than defaulting to the capture phrasing.
  const t = cmd.targets.find(x => x.id === targetId);
  ctExamineCtx = { kind: "target", targetId, chartId: t ? t.chart_id : null };
  const ex = await api("examine_target", targetId, {});
  ctRenderExamineModal(ex);
}

async function cmdDeleteTarget(targetId){
  if(!confirm("Delete this target?")) return;
  await api("delete_target", targetId);
  cmd.targets = cmd.targets.filter(t => t.id !== targetId);
  renderChartManageData();
}

// --- Safari Compass: Seed A advance-frame identification + route planning (clayton-b42.5.11)
// Separate from Seed B (the battle seed) above: this is about Seed A's OWN advance frame —
// how many Elm calls have been heard since it loaded — so the player can be told exactly how
// to reach a chosen encounter frame (e.g. one Pokefinder says holds the target Pokemon).
// Local hour -> "morning"/"day"/"night", mirroring claytonlib.safari_encounters.time_of_day
// exactly (morning 4-9:59, day 10-19:59, night 20-3:59) — parsed straight out of the ISO
// string rather than through a Date object, so there's no timezone-conversion risk.
function timeOfDay(isoTimeStr){
  const m = /T(\d{2}):/.exec(isoTimeStr || "");
  if(!m) return null;
  const hour = Number(m[1]);
  if(hour >= 4 && hour < 10) return "morning";
  if(hour >= 10 && hour < 20) return "day";
  return "night";
}

// Shown both before the current frame is pinned (so it's ready by the time auto-resolve
// runs right after pinning) and after, on the "change target frame" retry screen — one piece
// of state (sac.aimAdvance) backs both, kept in sync via oninput regardless of which is on
// screen. Not shown for Pokefinder mode (that's a manual target-frame entry instead) or
// before Pokemon/Safari area are configured (renderInHouseFrameSearch explains why then).
function _sacAimAdvanceField(){
  if(sac.e.preferences?.target_frame_source === "pokefinder") return "";
  if(!sac.e.pokemon || !sac.e.safari_area) return "";
  // An exact key-seed hit never needs an in-house search at all -- the target frame is
  // already known (sac.e.key_seed_advances) -- so this field (which only feeds that search,
  // see sacFindTargetFrame) is pointless here regardless of whether Seed A is pinned yet.
  // Checked HERE, inside the one shared function, rather than at each of this function's
  // call sites -- round 11 feedback's fix only covered the POST-pinning call site
  // (renderInHouseFrameSearch), missing the PRE-pinning one in renderFrameGuideSection
  // (shown while still collecting Elm calls to pin the current frame), which is the one the
  // user actually hits first on a key-seed match; guarding centrally here can't miss a call
  // site like that again.
  if(sac.seedA && sac.seedA.seed === sac.e.key_seed && sac.e.key_seed_advances != null) return "";
  return `<div class="field"><label>(Optional) Look for ${esc(sac.e.pokemon)} near advance</label>
    <input id="sac-aim-advance" type="number" min="0" placeholder="nearest"
      value="${esc(sac.aimAdvance ?? "")}" oninput="sac.aimAdvance = this.value"
      onkeydown="if(event.key==='Enter'){event.preventDefault();$('sac-frame-elm-new')?.focus();}"></div>`;
}

function renderFrameGuideSection(){
  if(!sac.seedA) return `<h3>Seed A advances</h3><div class="status">Identify Seed A first.</div>`;
  if(sac.pinnedFrame == null){
    const candInfo = !sac.frameCandidates ? ""
      : sac.frameCandidates.length === 0
        ? `<div class="notice warn">Those calls don't match this seed's Elm sequence — check your input.</div>`
        : `<div class="status">${sac.frameCandidates.length} possible frame(s): ${sac.frameCandidates.join(", ")} — keep listening.</div>`;
    return `<h3>Seed A advances</h3>
      <div class="hint muted" style="margin-bottom:8px">Needed for calibration — pin which
        advance frame Seed A is on right now.</div>
      ${_sacAimAdvanceField()}
      ${sac.frameObservedElm ? `<div class="hint muted">Elm calls so far: <code>${esc(sac.frameObservedElm)}</code>
        <button class="btn small" type="button" onclick="sacChangeFrameElm()">Change</button></div>` : ""}
      <div class="field"><label>New Elm calls heard (P/E/K) — Enter to apply</label>
        <input id="sac-frame-elm-new" value="${esc(sac.frameElmPrefill || "")}" placeholder="PEKE…" autocomplete="off"
          onkeydown="if(event.key==='Enter'){event.preventDefault();sacAppendFrameElm();}"></div>
      ${candInfo}
      <button class="btn small" onclick="sacAppendFrameElm()">Apply</button>`;
  }
  if(!sac.frameGuide){
    const pokefinder = (sac.e.preferences?.target_frame_source === "pokefinder");
    // An exact key-seed hit already has a known encounter frame (the expedition's configured
    // key_seed_advances) -- no need to look it up in Pokefinder, so the field is shown
    // disabled with an explanation instead of asking for a value that's already known.
    const keySeedHit = sac.seedA.seed === sac.e.key_seed && sac.e.key_seed_advances != null;
    return `<h3>Seed A advances</h3>
      <div class="info-line">Current advance frame: <b>${sac.pinnedFrame}</b></div>
      ${keySeedHit ? `<div class="hint muted" style="margin-bottom:8px">Seed A matches the
          key seed, so this advances to key seed advances — resolving automatically…</div>`
        : pokefinder ? `
          <div class="field"><label>Target encounter frame (from Pokefinder)</label>
            <input id="sac-target-frame" type="number" min="0" placeholder="81"></div>
          <button class="btn small primary" onclick="sacPlanFrameRouteFromInput()">Plan route</button>`
        : renderInHouseFrameSearch()}`;
  }
  const g = sac.frameGuide;
  const r = sac.inHouseSearch;
  return `<h3>Seed A advances</h3>
    <div class="info-line">Current advance frame: <b>${g.current_frame}</b></div>
    <div class="info-line done">${g.chatot_flips > 0 ? `${g.chatot_flips} chatot flip(s), then ` : ""}${g.elm_before_scent} Elm call(s) → frame ${g.encounter_frame}, Sweet Scent there.</div>
    ${r && !r.error ? `<div class="hint muted">Found in-house: frame ${r.frame} (L${r.level})
        ${r.all_ambiguous ? `<span class="badge warn">every candidate's Elm margin is ambiguous — verify carefully</span>`
          : r.skipped_ambiguous ? `(skipped ${r.skipped_ambiguous} nearer frame(s) with an ambiguous margin)` : ""}</div>` : ""}
    <div class="status">Guide: <code>${esc(g.guide)}</code> (Sweet scent at the "!")
      ${g.truncated ? ` — <span class="badge warn">truncated, needs a longer Elm sequence</span>` : ""}
      ${g.ambiguous ? ` <span class="badge warn">ambiguous margin</span>` : ""}</div>
    <button class="btn small" onclick="sacReplanFrame()">Change target frame</button>`;
}

function renderInHouseFrameSearch(){
  if(!sac.e.pokemon || !sac.e.safari_area){
    return `<div class="notice warn">Set Pokémon and Safari area in Configure to use the
      in-house search (or switch to Pokefinder in Preferences).</div>`;
  }
  const r = sac.inHouseSearch;
  const errLine = r?.error ? `<div class="notice warn">${esc(r.error)}</div>` : "";
  return `
    ${_sacAimAdvanceField()}
    <button class="btn small" onclick="sacFindTargetFrame()">Find frame</button>
    ${errLine}`;
}

// Auto-resolves the target encounter frame once the current frame is pinned: an exact
// key-seed hit uses the expedition's own configured frame (no search needed — see
// claytonlib.safari_advance's choose_target_frame in-house branch this mirrors) regardless
// of target_frame_source, since that's known without looking anything up in EITHER mode.
// Otherwise, Pokefinder still needs manual entry (that data can't be derived) and is left
// for the user in renderFrameGuideSection above; the in-house search runs automatically.
async function sacAutoResolveFrame(){
  if(sac.seedA.seed === sac.e.key_seed && sac.e.key_seed_advances != null){
    await sacPlanFrameRoute(sac.e.key_seed_advances);
    return;
  }
  if(sac.e.preferences?.target_frame_source === "pokefinder") return;
  if(!sac.e.pokemon || !sac.e.safari_area) return;  // renderInHouseFrameSearch shows why
  await sacFindTargetFrame();
}

async function sacFindTargetFrame(){
  // Read from state, not the DOM element -- auto-resolve calls this right after pinning,
  // before the field has necessarily ever been rendered (it's shown BEFORE pinning too, per
  // clayton-b42.9.6, specifically so a value typed there is already available here).
  const aim = (sac.aimAdvance ?? "").toString().trim();
  try{
    sac.inHouseSearch = await api("safari_compass_find_target_frame", {
      seed: sac.seedA.seed, prev_routes: sac.seedAParams.prev_routes,
      current_frame: sac.pinnedFrame, area: sac.e.safari_area, tod: timeOfDay(sac.initialTime),
      block_config: sac.e.block_config, pokemon: sac.e.pokemon,
      margin: sac.e.preferences?.elm_calls_after_flips ?? 3,
      aim_advance: aim === "" ? null : Number(aim)});
  }catch(err){
    sac.inHouseSearch = { error: String(err && err.message ? err.message : err) };
    renderSafariCompassNewRun();
    return;
  }
  await sacPlanFrameRoute(sac.inHouseSearch.frame);  // no confirm step — use it
}

// Runs identification against the FULL accumulated sac.frameObservedElm and updates state —
// shared by the Enter-to-apply flow and its own callers below. Auto-resolves the target frame
// once pinned (see sacAutoResolveFrame), unless Pokefinder is configured (needs manual entry).
async function sacIdentifyFrame(){
  const res = await api("safari_compass_identify_frame", {
    seed: sac.seedA.seed, prev_routes: sac.seedAParams.prev_routes,
    observed_elm: sac.frameObservedElm});
  sac.frameCandidates = res.frames;
  if(res.pinned){
    sac.pinnedFrame = res.frame;
    renderSafariCompassNewRun();
    await sacAutoResolveFrame();
    return;
  }
  renderSafariCompassNewRun();
  // The re-render above replaces #sac-frame-elm-new with a fresh DOM node — nothing carries
  // focus over automatically, so Enter-to-apply here would otherwise drop focus every time.
  $("sac-frame-elm-new")?.focus();
}

async function sacAppendFrameElm(){
  const el = $("sac-frame-elm-new");
  const add = (el.value || "").trim();
  if(!add) return;
  sac.frameObservedElm = (sac.frameObservedElm || "") + add;
  sac.frameElmPrefill = "";
  await sacIdentifyFrame();
}

async function sacChangeFrameElm(){
  const moved = sac.frameObservedElm || "";
  sac.frameObservedElm = ""; sac.frameCandidates = null;
  sac.pinnedFrame = null; sac.frameGuide = null; sac.inHouseSearch = null;
  sac.frameElmPrefill = moved;
  renderSafariCompassNewRun();
  $("sac-frame-elm-new")?.focus();
}

function sacPlanFrameRouteFromInput(){
  sacPlanFrameRoute(Number($("sac-target-frame").value));
}

async function sacPlanFrameRoute(target){
  if(!target){ toast("Enter a target encounter frame."); return; }
  sac.frameGuide = await api("safari_compass_plan_frame", {
    seed: sac.seedA.seed, prev_routes: sac.seedAParams.prev_routes,
    current_frame: sac.pinnedFrame, encounter_frame: target,
    margin: sac.e.preferences?.elm_calls_after_flips ?? 3});
  renderSafariCompassNewRun();
  // Seed A advances is done -- Seed B's path input just unlocked, so move straight there.
  $("sac-path-new")?.focus();
}

function sacReplanFrame(){
  sac.frameGuide = null;
  sac.inHouseSearch = null;
  renderSafariCompassNewRun();
}

// Enter in any of the three Seed A search fields acts like clicking Generate; Enter on
// observed roamer routes moves to Elm calls; Enter on Elm calls confirms Seed A once
// narrowing has reached exactly one candidate — same flow as Metronome Compass New Run.
function sacSeedAKey(ev){
  if(ev.key === "Enter"){ ev.preventDefault(); sacGenerateSeedA(); }
}
function sacObsRelKey(ev){
  if(ev.key === "Enter"){ ev.preventDefault(); $("sac-elm")?.focus(); }
}
function sacElmKey(ev){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const cands = sac.seedACandidates?.candidates;
  if(cands && cands.length === 1) sacPickSeedA(cands[0].seed);
}

async function sacGenerateSeedA(){
  sacCaptureHeader();
  if(!sac.initialTime){ toast("Set an initial time first."); return; }
  sac._startrel = $("sac-startrel").value;
  const prev = parseStartRel(sac._startrel);
  sac.seedAParams = {
    target_time: sac.initialTime, key_seed: sac.e.key_seed, prev_routes: prev,
    seconds_window: Number($("sac-secwin").value), delay_window: Number($("sac-delaywin").value),
    match_parity: $("sac-parity").checked };
  sac.seedACandidates = await api("metronome_seed_a", sac.seedAParams);
  sac.keyInfo = await api("metronome_key_seed_info", sac.e.key_seed, prev);
  sac.secondsWindow = sac.seedAParams.seconds_window; sac.delayWindow = sac.seedAParams.delay_window;
  sac.matchParity = sac.seedAParams.match_parity;
  // Header + Roamer-search values are locked in now (per Seed A completing) — remember them
  // for next time, so repeat hunts on this expedition don't need retyping.
  sac.e = await api("save_expedition", {...sac.e, last_target: {
    initial_time: sac.initialTime, vector_ms: sac.vectorMs},
    last_safari_compass_defaults: {...sac.e.last_safari_compass_defaults, startrel: sac._startrel,
      seconds_window: sac.secondsWindow, delay_window: sac.delayWindow, match_parity: sac.matchParity}});
  renderSafariCompassNewRun();
  $("sac-obsrel")?.focus();
}

async function sacNarrowSeedA(){
  const params = {...sac.seedAParams,
    rel_observed: $("sac-obsrel").value, elm_observed: $("sac-elm").value};
  sac.seedACandidates = await api("metronome_seed_a", params);
  $("sac-obsrel").classList.toggle("invalid", sac.seedACandidates.rel_valid === false);
  $("sac-candA").innerHTML = renderCandA(sac.seedACandidates, "sacPickSeedA");
}

function updateSacKeyInfoLine(){
  const box = $("sac-keyinfo");
  if(box && sac.keyInfo){
    const k = sac.keyInfo;
    box.textContent = `key seed: R${k.r_route??"·"} E${k.e_route??"·"} L${k.l_route??"·"} · elm ${k.elm}`;
  }
}

function sacPickSeedA(seed){
  const picked = sac.seedACandidates.candidates.find(c => c.seed === seed);
  const changed = sac.seedA && sac.seedA.seed !== picked.seed;
  // The Elm calls typed to narrow/pick Seed A ARE the calls heard since it loaded — prefill
  // the frame-guide's input with them (not auto-commit: the user should get a chance to
  // review/correct a mistyped call before it's applied — clayton-b42.7.13).
  const elmHeard = $("sac-elm")?.value || "";
  sac.seedA = picked;
  sac.editingSeedA = false;
  if(changed){
    sac.seedB = null; sac.seedBResult = null; sac.path = "";
    sac.frameObservedElm = ""; sac.frameCandidates = null; sac.pinnedFrame = null;
    sac.frameGuide = null; sac.inHouseSearch = null; sac.aimAdvance = "";
  }
  sac.frameElmPrefill = elmHeard;
  renderSafariCompassNewRun();
  // Show the full "seeds in range" set right away (empty path = no narrowing yet), instead
  // of leaving Seed B blank until the user's first keystroke.
  if(!sac.seedB) sacUpdateSeedB();
  // Seed A advances is the very next step once Seed A is identified — skip straight to its
  // Elm-calls input (the near-target-advance option above it stays reachable, just not
  // auto-focused; see renderFrameGuideSection).
  $("sac-frame-elm-new")?.focus();
}
function sacChangeSeedA(){ sac.editingSeedA = true; renderSafariCompassNewRun(); }
function sacKeepSeedA(){ sac.editingSeedA = false; renderSafariCompassNewRun(); }

function renderCandBSafari(res){
  if(!res.path_valid)
    return `<div class="status" style="color:var(--danger)">Unrecognized character in the path.</div>`;
  // Flee flags only exist on each row once the app has narrowed to <=5 candidates (see
  // app/safari_compass.py's seed_b) — the column itself only appears then, not as an
  // always-present empty column while candidates are still numerous.
  const showFlee = res.candidates.some(c => c.flee_flags);
  const rows = res.candidates.slice(0, 60).map(c => `
    <tr><td>${esc(c.seed_hex)}</td><td>${c.frame}</td>
      <td>${c.delta>=0?"+":""}${c.delta ?? "·"}</td><td>${(c.posterior*100).toFixed(2)}%</td>
      ${showFlee ? `<td>${(c.flee_flags && c.flee_flags.length)
          ? c.flee_flags.map(f => { // "F!" isn't a warning about a future turn — it means this
              // candidate has ALREADY fled and is waiting on you to type F. Colour it apart
              // from the predictive flags so it reads as an action, not a forecast.
              const col = f.code === "F!" ? "var(--ember)" : "var(--grass)";
              return `<span title="${esc(f.tooltip)}" style="cursor:help;color:${col};border-bottom:1px dotted ${col}">${esc(f.code)}</span>`;
            }).join(", ")
          : "—"}</td>` : ""}
    </tr>`).join("");
  return `<div class="status"><b>${res.count}</b> / ${res.total} candidate(s) match</div>
    <div class="candtable"><table><thead><tr><th title="A candidate battle seed still consistent with the path you have entered.">seed</th><th title="The delay (game frame) this candidate seed was generated on.">frame</th><th title="How far this candidate sits from the frame the model predicted.">δ</th><th title="Relative chance this is the seed you actually hit, given the path so far.">P</th>
      ${showFlee ? `<th title="Guaranteed flee outcomes if you repeat that action from here, looking ahead up to 3 turns">flee flags <span class="hint" style="font-weight:normal">(hover)</span></th>` : ""}
      </tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function renderSeedBSafari(){
  if(!sac.seedA) return `<h3>Seed B — battle seed</h3>
    <div class="status">Identify Seed A first.</div>`;
  if(sac.seedB){
    return `<h3>Seed B — identified</h3>
      <div class="info-line done">Seed B ${esc(sac.seedB.seed_hex)} · frame ${sac.seedB.frame}</div>
      <button class="btn small" onclick="sacResetSeedB()">Change Seed B</button>`;
  }
  const r = sac.seedBResult;
  // `table` (candidates), `message` (unique-seed/terminal status + the "Use this seed" button)
  // and `macheteLine` (just Machete's predicted continuation, separate from the observed
  // path) are kept apart so they can be laid out in the order round 10 feedback asked for:
  // table first (already visible without scrolling right after an observation), then the
  // status message, then "Path so far", then the machete prediction, then the input.
  let table = "", message = "", macheteLine = "";
  if(sac.seedBError){
    table = `<div class="notice warn">Couldn't load candidates: ${esc(sac.seedBError)}</div>`;
  } else if(sac.seedBLoading){
    table = `<div class="muted">Loading candidates…</div>`;
  } else if(r){
    table = renderCandBSafari(r);
    if(r.path_valid && r.identified_seed){
      const mpath = r.machete_path;
      message = `${mpath ? `<div class="hint muted">Machete predicts a capture path — the bold action is next.</div>`
          : `<div class="notice warn">Seed identified, but Machete found no capture path from here.</div>`}
        <button class="btn small primary" onclick="sacAcceptSeedB()">Use this seed</button>`;
      // overflow-wrap/word-break so a long path wraps instead of overflowing the panel.
      macheteLine = mpath && mpath.length
        ? `<div class="hint muted" style="margin-top:6px"><b>Machete path:</b>
            <code style="overflow-wrap:anywhere;word-break:break-all"><b style="color:var(--grass)">${esc(mpath[0])}</b>${esc(mpath.slice(1))}</code></div>`
        : "";
    } else if(r.path_valid && r.terminal){
      message = `<div class="notice warn">Run ended (${r.terminal}) — ${r.count} seed(s) still match
          ${r.count>1?"(not uniquely identified; check your path or reset).":""}</div>
        ${r.count===1?`<button class="btn small primary" onclick="sacAcceptSeedB()">Use this seed</button>`:""}
        ${r.count===0?_sacWidenPrompt():""}`;
    } else if(r.path_valid && r.count===0){
      message = _sacWidenPrompt();
    }
  }
  return `<h3 id="sac-seedb-anchor">Seed B — battle seed</h3>
    ${table}
    ${message}
    ${sac.path ? `<div class="hint muted">Path so far: <code>${esc(sac.path)}</code>
      <button class="btn small" type="button" onclick="sacChangePath()">Change</button></div>` : ""}
    ${macheteLine}
    <div class="hint muted" style="margin-top:14px"><b>New observations</b> — Enter to apply</div>
    <div class="hint muted legend">
      <span><b>m</b> mud</span><span><b>M</b> mud, crit</span>
      <span><b>b</b> bait</span><span><b>B</b> bait, crit</span>
      <span><b>0–3</b> ball shake count</span>
      <span><b>F</b> fled</span><span><b>C</b> captured</span>
      <span><b>u</b> undo last</span>
      <span><button class="btn small" type="button" onclick="sacShowCheatsheet()">? full guide</button></span>
    </div>
    <div class="field">
      <input id="sac-path-new" placeholder="bbbBbb0321" autocomplete="off"
        onkeydown="if(event.key==='Enter'){event.preventDefault();sacAppendPath();}"></div>
    <div class="hint muted">Enter what you actually see, turn by turn, one character per turn
      (a ball throw is its shake count, 0-3) — press Enter to apply it and narrow.</div>`;
}

async function sacShowCheatsheet(){
  // Toggle: clicking "? full guide" again while it's already open closes it instead of
  // re-fetching and reopening the same pane (round 10 feedback).
  if($("side-pane")){ closeSidePane(); return; }
  const rows = (await api("safari_compass_cheatsheet", sac.e.pokemon))
    .filter(r => r.key !== "J");  // Jane isn't wired up in the app
  // No quote marks and explicit wrapping on the message column -- .candtable's default
  // white-space:nowrap is right for the short type/action columns but was cutting off the
  // longer in-game messages, forcing horizontal scroll to read the letter alongside the
  // message it corresponds to (round 9 feedback).
  const trs = rows.map(r => {
    const message = r.key === "?x"
      ? "(You know the action but missed the message)"
      : (r.message === "—" ? "—" : esc(r.message));
    return `<tr><td><code>${esc(r.key)}</code></td><td>${esc(r.action)}</td>
      <td style="white-space:normal">${message}</td></tr>`;
  }).join("");
  openSidePane(`<h3>Seed B — full guide</h3>
    <div class="hint muted" style="margin-bottom:8px">Type the letter for whichever message you see.</div>
    <div class="candtable" style="max-height:none"><table><thead><tr>
        <th title="The character to type into the path box.">type</th><th title="What that character means.">action</th><th title="What you see on screen when this happens.">in-game message</th></tr></thead>
      <tbody>${trs}</tbody></table></div>
    <div class="actions"><button class="btn" onclick="closeSidePane()">Close</button></div>`);
}

// Runs the query against the FULL accumulated sac.path and updates state — shared by the
// auto-fetch on Seed A pick (empty path) and the Enter-to-apply flow below.
async function sacUpdateSeedB(){
  sac.seedBLoading = true; sac.seedBError = null;
  $("sac-seedb").innerHTML = renderSeedBSafari();
  try{
    sac.seedBResult = await api("safari_compass_seed_b", sac.expId, {
      initial_time: sac.initialTime, vector_ms: sac.vectorMs, path: sac.path,
      machete_max_turns: sac.e.preferences?.machete_max_turns ?? 50,
      // The advance count THIS run will make — the frame the planned route Sweet Scents on.
      // Only used by a model carrying a per-advance safari offset; this panel is locked until
      // a route is planned, so frameGuide is always set by the time we get here.
      advances: sac.frameGuide?.encounter_frame ?? null,
      expand_frames: sac.seedBExpandFrames, expand_seconds: sac.seedBExpandSeconds});
  }catch(err){
    // api() already toasted this — also keep it visible in the panel itself (a toast is easy
    // to miss, and this spot was previously left silently blank on any failure).
    sac.seedBResult = null;
    sac.seedBError = String(err && err.message ? err.message : err);
  }
  sac.seedBLoading = false;
  $("sac-seedb").innerHTML = renderSeedBSafari();
}

// The full recognized grammar (m/M/a=mud, b/B/e=bait, 0-3=ball shakes, F/C=terminal, u=undo,
// ?<char>=uncertain result) except Jane ('J'), which app.safari_compass.seed_b silently drops
// rather than acting on. Reject anything else BEFORE it's appended, since one bad character
// anywhere in the accumulated path makes the whole thing unparseable server-side with no way
// to tell which character did it.
function _pathCharsValid(s){
  return /^[mMabBeFCu0-3?]*$/.test(s);
}

async function sacAppendPath(){
  const el = $("sac-path-new");
  const add = (el.value || "").trim();
  if(!add) return;
  if(!_pathCharsValid(add)){
    toast("Unrecognized character — use m/M/b/B/0-3/F/C/u only.");
    return;
  }
  // 'u' undoes the last observation rather than being appended as a literal character --
  // the backend's own parser already treats 'u' as an undo action against the candidate
  // state, but "Path so far" was still showing the raw typed 'u' verbatim (round 10
  // feedback), so this keeps the displayed path in sync with what actually happened.
  const chars = (sac.path || "").split("");
  for(const ch of add){
    if(ch === "u") chars.pop();
    else chars.push(ch);
  }
  sac.path = chars.join("");
  await sacUpdateSeedB();
  _sacFocusPathInput();
}

function _sacFocusPathInput(){
  const el = $("sac-path-new");
  if(!el) return;
  // preventScroll so the browser's own "scroll the newly-focused element into view" doesn't
  // fight with the explicit scroll below -- the input keeps keyboard focus either way, so it
  // doesn't need to be the visible part; the candidate table does (see below).
  el.focus({preventScroll: true});
  // The candidate table now renders ABOVE the input (see renderSeedBSafari), specifically so
  // it's already visible right after submitting an observation. Scroll to the TOP of the Seed
  // B section (the table's end) rather than the input's own position -- an end-of-container
  // scroll (tried in round 8) still left the newly-updated table off-screen whenever the
  // section was taller than the viewport, since it anchored to whatever was at the DOM bottom,
  // which was the input, not the table. Anchoring to the section's start instead means the
  // table is the first thing in view, with no scroll needed to read the result of what you
  // just typed -- the input is still focused, just not necessarily visible, which is fine
  // since typing doesn't require seeing the caret in this flow.
  $("sac-seedb-anchor")?.scrollIntoView({block: "start", behavior: "smooth"});
}

async function sacChangePath(){
  const moved = sac.path || "";
  sac.path = "";
  await sacUpdateSeedB();
  const el = $("sac-path-new");
  if(el){ el.value = moved; el.focus(); }
}

// When the observed path eliminates every candidate, the calibrated (probability-weighted)
// search window might just be too narrow — offer a literal frame/second expansion and retry
// the SAME path, mirroring the notebook interactive tool's "expand" command (claytonlib.
// compass._prompt_expand) — see app.safari_compass.expand_window for why this must be a
// literal range rather than just raising k (mass_cap was always the real binding constraint).
function _sacWidenPrompt(){
  const already = (sac.seedBExpandFrames || sac.seedBExpandSeconds)
    ? ` (already widened by ±${sac.seedBExpandFrames||0} frames, ±${sac.seedBExpandSeconds||0}s)`
    : "";
  return `<div class="notice warn" style="margin-top:8px">No candidates match this path within
      the current search window${esc(already)}.
      <button class="btn small" style="margin-left:8px" onclick="sacOpenWidenModal()">Widen search window</button></div>`;
}

function sacOpenWidenModal(){
  openModal(`<h3>Widen search window</h3>
    <div class="hint muted" style="margin-bottom:8px">Expand the search by a literal frame/
      second range around the calibrated target — for when the real landing missed further
      than the model expects.</div>
    <form onsubmit="return sacApplyWiden(event)">
      <div class="grid2">
        <div class="field"><label>Expand frames by (each side)</label>
          <input name="frames" type="number" min="0" value="200" autofocus></div>
        <div class="field"><label>Expand seconds by (each side)</label>
          <input name="seconds" type="number" min="0" value="1"></div>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">Search</button>
        <button class="btn" type="button" onclick="closeModal()">Cancel</button>
      </div>
    </form>`);
}

async function sacApplyWiden(ev){
  ev.preventDefault();
  const f = ev.target;
  sac.seedBExpandFrames = (sac.seedBExpandFrames || 0) + Number(f.frames.value);
  sac.seedBExpandSeconds = (sac.seedBExpandSeconds || 0) + Number(f.seconds.value);
  closeModal();
  await sacUpdateSeedB();
  return false;
}

function sacAcceptSeedB(){
  const r = sac.seedBResult;
  if(!r || !r.count) return;
  // identified_seed implies terminal is null (see app.safari_compass.seed_b) -- i.e. this
  // candidate hasn't fled or been captured yet -- so a machete_path here means there's still
  // a live capture opportunity in progress. Committing to Seed B now stops the interactive
  // narrowing flow, which could be premature; confirm before cutting that short (round 10
  // feedback).
  if(r.identified_seed && r.machete_path && r.machete_path.length){
    const name = capName(sac.e.pokemon) || "the Pokémon";
    if(!confirm(`Machete has a capture path for this seed, and ${name} hasn't been captured `
        + `yet — are you sure you want to commit to this seed now?`)) return;
  }
  const c = r.candidates[0];
  sac.seedB = { seed: c.seed, seed_hex: c.seed_hex, frame: c.frame, path: sac.path };
  renderSafariCompassNewRun();
}

// "Change Seed B" retains the observed path rather than clearing it (round 10 feedback) --
// re-queries against that same path so the candidate table isn't left stale/empty. Also
// keeps any widened search window as-is (round 11 feedback) -- it's cheap to keep applying
// and re-widening from scratch every time you change your mind about Seed B would be
// annoying; only a full sacReset() (a genuinely new run) clears it back to 0.
async function sacResetSeedB(){
  sac.seedB = null;
  await sacUpdateSeedB();
}

function openSaveSafariRunModal(){
  if(!(sac.seedA && sac.seedB)) return;
  const g = sac.frameGuide;
  openModal(`<h3>Save run</h3>
    <form onsubmit="return sacSaveRun(event)">
      <div class="field"><label>Tag</label><input name="tag" value="${esc(sac.lastTag || "")}" placeholder="SCT1" autofocus></div>
      <div class="field"><label>Notes</label><input name="notes" placeholder="optional"></div>
      ${_advanceRecipeFields(g ? {elm_calls: g.elm_before_scent, chatot_flips: g.chatot_flips,
                                   advance_frame: g.encounter_frame} : null)}
      <div class="actions">
        <button class="btn primary" type="submit">Save</button>
        <button class="btn" type="button" onclick="closeModal()">Cancel</button>
      </div>
    </form>`);
}

function sacShowSavedPrompt(){
  openModal(`<h3>Run saved</h3>
    <p class="muted" style="margin:0 0 16px">Start another run, or head back to the expedition?</p>
    <div class="actions">
      <button class="btn" type="button" onclick="closeModal();openExpeditionHome('${esc(sac.expId)}')">Done</button>
      <button class="btn primary" type="button" onclick="closeModal();safariCompassNewRun('${esc(sac.expId)}')">Start another run</button>
    </div>`);
}

async function sacSaveRun(ev){
  ev.preventDefault();
  const f = ev.target;
  const tag = f.tag.value.trim();
  await api("save_safari_run", sac.e.profile_id, {
    tag, vector_ms: sac.vectorMs,
    notes: f.notes.value.trim(), a_seed: sac.seedA, b_seed: sac.seedB,
    frame_guide: sac.frameGuide?.description || "", ..._readAdvanceRecipe(f) });
  sac.e = await api("save_expedition", {...sac.e,
    last_safari_compass_defaults: {...sac.e.last_safari_compass_defaults, tag}});

  // "C" (captured) as the observed path's last character + Seed A on the key seed -- offer
  // to mark the expedition complete (round 12 feedback), unless it already is.
  const captured = (sac.seedB?.path || "").endsWith("C");
  const keySeedHit = sac.seedA?.seed === sac.e.key_seed;
  if(captured && keySeedHit && !sac.e.completed) sacShowMarkCompletePrompt();
  else sacShowSavedPrompt();
  return false;
}

function sacShowMarkCompletePrompt(){
  openModal(`<h3>Nice catch!</h3>
    <p class="muted" style="margin:0 0 16px">Seed A matched the key seed and this run ended
      in a capture — mark this expedition as complete?</p>
    <div class="actions">
      <button class="btn primary" type="button" onclick="closeModal();sacMarkCompleteThenPrompt()">Mark as complete</button>
      <button class="btn" type="button" onclick="closeModal();sacShowSavedPrompt()">Not yet</button>
    </div>`);
}
async function sacMarkCompleteThenPrompt(){
  sac.e = await api("set_expedition_completed", sac.expId, true);
  toast("Marked as complete.");
  sacShowSavedPrompt();
}

function sacReset(){
  sac.seedA = null; sac.seedACandidates = null; sac.editingSeedA = false;
  sac.seedB = null; sac.seedBResult = null; sac.path = "";
  sac.seedBExpandFrames = 0; sac.seedBExpandSeconds = 0;
  sac.frameObservedElm = ""; sac.frameElmPrefill = ""; sac.frameCandidates = null;
  sac.pinnedFrame = null; sac.frameGuide = null; sac.inHouseSearch = null; sac.aimAdvance = "";
  sac._startrel = ""; renderSafariCompassNewRun();
}

// --- Safari Compass: Review Data --------------------------------------------
// Safari runs feed the safari load-path offset fit (this page's own Calibrate Model tab
// — a chosen base model held fixed while the offset is refit, see app/calibration.py's
// preview_safari_offset). This is deliberately separate from Metronome Compass's own
// Calibrate Model, which never looks at safari runs or produces a safari_offset.
let sreview = null;
async function safariReviewData(expId){
  const e = await api("get_expedition", expId);
  const [runs, profile] = await Promise.all([
    api("list_runs", e.profile_id, "safari"), api("get_profile", e.profile_id)]);
  sreview = { expId, profileId: e.profile_id, runs, profile, tag: "", view: "runs",
    keyAdvances: e.key_seed_advances,
    preview: null, delayMetrics: null,
    dirty: {}, dirtyTags: {}, savedModels: null, calBaseId: null, calPreview: null,
    // Calibrate Model fit-time options (clayton-6h2.6). Fit-time only: whatever they produce is
    // baked into the saved model, so prediction just uses whichever model is active. Defaulted
    // from the chosen base model in sreviewSelectBaseModel, so they persist without re-clicking.
    calPerAdvance: false, calSafariJitter: false,
    exportMode: false, exportSelected: {} };
  await sreviewRefreshPreview();
  renderSafariReview();
}
async function sreviewRefreshPreview(){
  if(sreview.runs.length === 0){ sreview.preview = null; sreview.delayMetrics = null; return; }
  try{ sreview.delayMetrics = (await api("run_delay_metrics", sreview.profileId, "safari")).metrics; }
  catch(err){ sreview.delayMetrics = null; }
  try{ sreview.preview = await api("safari_run_exclude_reasons", sreview.profileId); }
  catch(err){ sreview.preview = null; }
}
function sreviewHasUnsaved(){
  return Object.keys(sreview.dirty).length > 0 || Object.keys(sreview.dirtyTags).length > 0;
}
function sreviewLeavePage(expId){
  if(sreviewHasUnsaved() && !confirm("You have unsaved exclusion changes. Leave and discard them?")) return;
  openExpeditionHome(expId);
}
async function sreviewSwitchView(view){
  if(view !== sreview.view && sreviewHasUnsaved()){
    if(!confirm("You have unsaved exclusion changes. Switch tabs and discard them?")) return;
    sreview.dirty = {}; sreview.dirtyTags = {};
  }
  sreview.view = view;
  if(view === "calibrate" && !sreview.savedModels){
    await sreviewLoadSavedModels();
    await sreviewCalibrateRefresh();
  }
  renderSafariReview();
}
function renderSafariReview(){
  const tabs = `<div class="chip-row">
      <span class="chip ${sreview.view==="runs"?"active":""}" onclick="sreviewSwitchView('runs')">Runs</span>
      <span class="chip ${sreview.view==="tags"?"active":""}" onclick="sreviewSwitchView('tags')">Tags</span>
      <span class="chip ${sreview.view==="calibrate"?"active":""}" onclick="sreviewSwitchView('calibrate')">Calibrate Model</span>
    </div>`;
  const body = sreview.view === "tags" ? renderSafariReviewTags()
    : sreview.view === "calibrate" ? renderSafariCalibrateModel()

  mount(`<div class="head"><h2>Safari Compass — Review Data</h2>
      <button class="btn" onclick="sreviewLeavePage('${esc(sreview.expId)}')">← Expedition</button></div>
    ${tabs}${body}`);
}

    ? `<div id="runs-export-bar" class="notice warn" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

      <span>${dirtyCount} unsaved exclusion change(s)</span>
      <span><button class="btn small" onclick="sreviewDiscardChanges()">Discard</button>
      <button class="btn small primary" onclick="sreviewSaveChanges()">Save changes</button></span>
    </div>` : "";
  const body = sreview.runs.length === 0
    ? `<div class="empty">No safari runs yet — save one from New Run.</div>`

        ${exportMode ? `<th title="Tick the runs to include in the export file.">export</th>` : ""}
        ${_th("saved","saved")}${_th("tag","tag")}${_th("seedA","Seed A")}${_th("seedB","Seed B")}
        ${_th("vms","Vms")}${_th("vdelay","V delay")}${_th("ddelay","\u0394 delay")}
        ${_th("notes","note")}${exportMode ? "" : `<th title="${esc(_RUNS_COL_TITLES.exclude)}">exclude</th>`}<th></th></tr></thead>
        <tbody>${shown.map(r => { const reason = reasons[r.id] || "";
          const isDirty = sreview.dirty[r.id] !== undefined;
          const staged = isDirty ? sreview.dirty[r.id] : r.excluded;
          const rowBg = isDirty ? ' style="background:rgba(255,196,0,.12)"' : "";
          const muted = (reason && !isDirty) ? ' style="opacity:.6"' : "";
          const selected = !!sreview.exportSelected?.[r.id];
          const excludeCell = exportMode ? "" :
            _runsExcludeCell(reason, staged, isDirty, "sreviewStageToggle", r.id);
          return `<tr${rowBg}${exportMode ? ` class="pick${selected?" selected":""}" onclick="_runsExportToggleRow('sreview','${esc(r.id)}')"` : ""}>
          ${exportMode ? `<td><input type="checkbox" ${selected?"checked":""}></td>` : ""}
          <td${muted}>${esc(fmtSavedShort(r.saved_at))}</td><td${muted}>${esc(r.tag||"—")}</td>
          <td${muted}>${esc(fmtSeedShort(r.a_seed?.seed_hex))}</td>
          <td${muted}>${esc(fmtSeedShort(r.b_seed?.seed_hex))}</td>
          <td${muted}>${fmtVectorMs(r.vector_ms)}</td>${_runsDelayCells(metrics[r.id], muted)}
          <td>${r.notes ? `<span title="${esc(r.notes)}" style="cursor:help">📝</span>` : ""}</td>
          ${excludeCell}
          <td style="text-align:right"><button class="btn small danger" ${exportMode?"disabled":""}

        </tr>`;}).join("")}</tbody></table></div>`;

      <div class="field" style="margin:0;max-width:240px"><label>Filter by tag</label>

      <div style="display:flex;gap:8px;align-items:center">

      </div>
    </div>${saveBar}${body}

      Tag exclusion (Tags tab above) is shared with metronome runs — set from either Review
      Data page. Checkbox changes are staged — click "Save changes" to apply them, or
      "Discard" to revert.</div>`;
}

function renderSafariReviewTags(){
  const tags = [...new Set(sreview.runs.map(r => r.tag || "(untagged)"))].sort();
  if(!tags.length) return `<div class="empty">No tags yet.</div>`;
  const dirtyCount = Object.keys(sreview.dirtyTags).length;
  const saveBar = dirtyCount ? `<div class="notice warn" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span>${dirtyCount} unsaved tag change(s)</span>
      <span><button class="btn small" onclick="sreviewDiscardTagChanges()">Discard</button>
      <button class="btn small primary" onclick="sreviewSaveTagChanges()">Save changes</button></span>
    </div>` : "";
  const rows = tags.map(tag => {
    const inTag = sreview.runs.filter(r => (r.tag || "(untagged)") === tag);
    const isDirty = sreview.dirtyTags[tag] !== undefined;
    const excluded = isDirty ? sreview.dirtyTags[tag] : sreview.profile.excluded_tags.includes(tag);
    const included = inTag.filter(r => !r.excluded && !excluded).length;
    return `<tr${isDirty?' style="background:rgba(255,196,0,.12)"':""}><td>${esc(tag)}</td><td>${inTag.length}</td><td>${included}</td>
      <td><input type="checkbox" ${excluded?"checked":""}
        onchange="sreviewStageToggleTag('${esc(tag)}',this.checked)"> exclude tag</td></tr>`;
  }).join("");
  return `${saveBar}<div class="candtable" style="max-height:none"><table><thead><tr>
      <th title="A run label. Excluding a tag leaves every run carrying it out of the fits.">tag</th><th title="How many saved runs carry this tag.">runs</th><th title="Whether runs with this tag are fed to calibration fits.">included</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="hint muted" style="margin-top:14px">Excluding a tag does not change individual runs'
      own checkboxes — excluded runs show "tag:&lt;name&gt;" as their reason in the Runs view.
      Shared with Metronome Compass's Tags tab (same profile-level exclusion list). Changes are
      staged — click "Save changes" to apply them, or "Discard" to revert.</div>`;
}

function sreviewStageToggleTag(tag, checked){
  const current = sreview.profile.excluded_tags.includes(tag);
  if(current === checked) delete sreview.dirtyTags[tag];
  else sreview.dirtyTags[tag] = checked;
  renderSafariReview();
}

async function sreviewSaveTagChanges(){
  const tags = Object.keys(sreview.dirtyTags);
  let p = sreview.profile;
  for(const tag of tags){ p = await api("set_tag_excluded", sreview.profileId, tag, sreview.dirtyTags[tag]); }
  sreview.profile = p;
  sreview.dirtyTags = {};
  await sreviewRefreshPreview();
  renderSafariReview();
}

function sreviewDiscardTagChanges(){
  sreview.dirtyTags = {};
  renderSafariReview();
}
function sreviewStageToggle(runId, checked){
  const r = sreview.runs.find(x => x.id === runId);
  if(r && r.excluded === checked) delete sreview.dirty[runId];
  else sreview.dirty[runId] = checked;
  renderSafariReview();
}
async function sreviewSaveChanges(){
  const ids = Object.keys(sreview.dirty);
  await Promise.all(ids.map(id => api("set_run_excluded", id, sreview.dirty[id])));
  for(const id of ids){ const r = sreview.runs.find(x => x.id === id); if(r) r.excluded = sreview.dirty[id]; }
  sreview.dirty = {};
  await sreviewRefreshPreview();
  renderSafariReview();
}
function sreviewDiscardChanges(){
  sreview.dirty = {};
  renderSafariReview();
}
async function sreviewDelete(runId){
  if(!confirm("Delete this run permanently?")) return;
  await api("delete_run", runId);
  sreview.runs = sreview.runs.filter(x => x.id !== runId);
  delete sreview.dirty[runId];
  await sreviewRefreshPreview();
  renderSafariReview();
}

// Safari Compass's own Calibrate Model tab: pick ANY saved model (Standard included) as
// the base, fit safari_offset against it from this profile's safari runs, and save the
// result as a new model — never touching the base model's own trend (alpha/beta/coeffs).
async function sreviewLoadSavedModels(){
  sreview.savedModels = await api("list_calibration_models", sreview.profileId);
  if(!sreview.calBaseId){
    const active = sreview.savedModels.find(m => m.active);
    sreview.calBaseId = active ? active.id : (sreview.savedModels[0]?.id || null);
  }
}

async function sreviewCalibrateRefresh(){
  if(!sreview.calBaseId){ sreview.calPreview = null; return; }
  try{ sreview.calPreview = await api("preview_safari_calibration", sreview.profileId, sreview.calBaseId,
    {per_advance: sreview.calPerAdvance, safari_jitter: sreview.calSafariJitter}); }
  catch(err){ sreview.calPreview = null; }
}

async function sreviewSelectBaseModel(modelId){
  sreview.calBaseId = modelId;
  // Inherit the base model's own fit-time choices, so re-fitting from a model that already
  // carries a per-advance term (or a safari-path jitter) doesn't silently drop it.
  const base = (sreview.savedModels || []).find(m => m.id === modelId);
  const lin = base?.stats?.linear || base?.artifact?.models?.linear;
  if(lin){
    sreview.calPerAdvance = lin.safari_offset_per_advance != null;
    sreview.calSafariJitter = lin.safari_jitter_c != null;
  }
  await sreviewCalibrateRefresh();
  renderSafariReview();
}

async function sreviewToggleCalOption(key, on){
  sreview[key] = !!on;
  await sreviewCalibrateRefresh();
  renderSafariReview();
}

async function sreviewSaveSafariModel(ev){
  ev.preventDefault();
  const f = ev.target;
  await api("save_calibration_model", sreview.profileId, {
    name: f.name.value.trim(), make_active: f.make_active.checked, preview: sreview.calPreview});
  toast("Model saved.");
  await sreviewLoadSavedModels();
  await sreviewCalibrateRefresh();
  renderSafariReview();
  return false;
}

async function sreviewActivateModel(modelId){
  await api("set_active_calibration_model", sreview.profileId, modelId);
  await sreviewLoadSavedModels();
  renderSafariReview();
}

async function sreviewDeleteCalModel(modelId){
  if(!confirm("Delete this saved model?")) return;
  await api("delete_calibration_model", modelId);
  await sreviewLoadSavedModels();
  if(sreview.calBaseId === modelId){
    sreview.calBaseId = sreview.savedModels[0]?.id || null;
    await sreviewCalibrateRefresh();
  }
  renderSafariReview();
}

async function sreviewImportCalibrationModel(){
  const res = await api("import_calibration_model_from_file", sreview.profileId);
  if(res.imported){
    toast(`Imported as model #${res.number} (inactive — review and Make active if you want it).`);
    await sreviewLoadSavedModels();
    renderSafariReview();
  }
}

// How much to trust the per-advance slope, in plain terms. The slope is always reported --
// a rough early estimate is useful and its interval visibly shrinks as runs accumulate -- so
// this is a warning band, not a gate. The number that matters is the CI half-width scaled by
// THIS expedition's advance count: that's the correction's uncertainty in frames, directly
// comparable to the landing spread it's correcting. Only a mathematically unestimable slope
// (fewer than two distinct advance counts) is refused outright.
function _perAdvanceConfidence(frames, sigma){
  if(!(sigma > 0)) return null;
  const r = frames / sigma;
  if(r < 0.5) return {label: "Solid", cls: "ok",
    note: "well inside your landing spread — safe to rely on"};
  if(r < 1)   return {label: "Usable", cls: "ok",
    note: "smaller than your landing spread — reasonable to rely on"};
  if(r < 3)   return {label: "Rough", cls: "warn",
    note: "comparable to your landing spread — treat as a working guess, keep collecting"};
  return {label: "Very rough", cls: "warn",
    note: "much larger than your landing spread — this correction is mostly noise so far"};
}

function _sreviewPerAdvanceNote(pv){
  if(!pv.per_advance_requested) return "";
  const f = pv.safari_offset?.linear;
  const q = f?.quality;
  if(!q) return "";
  const missing = q.n_missing_advances
    ? ` ${q.n_missing_advances} run(s) have no recorded advance count.` : "";

  if(!q.estimable){
    return `<div class="notice warn" style="margin-top:12px">No per-advance offset yet:
      ${esc(q.reason || "not enough data")}. The flat safari_offset above was fit instead.${missing}</div>`;
  }

  const slope = `<strong>${Number(f.per_advance).toFixed(3)} frames/advance</strong>`;
  const from = `from ${q.n_with_advances} run(s) spanning ${Number(q.spread).toFixed(0)} advances`;
  const n = sreview.keyAdvances;

  // No CI at all (too few runs to resample) -- say so rather than implying precision.
  if(q.ci_halfwidth == null){
    return `<div class="notice warn" style="margin-top:12px">Per-advance offset ${slope}
      ${from} — ${esc(q.reason || "uncertainty unknown")}.${missing}</div>`;
  }

  const frames = q.ci_halfwidth * (n || 0);
  const conf = n ? _perAdvanceConfidence(frames, q.sigma_ref) : null;
  const scale = n
    ? `At your ${n} advances that is a correction of
       <strong>${(f.per_advance * n).toFixed(0)} &plusmn; ${frames.toFixed(0)} frames</strong>`
    : `Uncertainty is &plusmn;${q.ci_halfwidth.toFixed(3)} frames per advance`;
  const vs = (n && q.sigma_ref > 0)
    ? ` — against a landing spread of about ${Number(q.sigma_ref).toFixed(0)} frames.` : ".";

  return `<div class="notice ${conf ? conf.cls : ""}" style="margin-top:12px">
    ${conf ? `<span class="badge ${conf.cls}">${conf.label}</span> ` : ""}
    Per-advance offset ${slope} ${from}. ${scale}${vs}
    ${conf ? `<div class="hint muted" style="margin-top:4px">${conf.note} — collect more runs,
      with more varied advance counts, to narrow it.</div>` : ""}${missing}</div>`;
}

function renderSafariCalibrateModel(){
  const models = sreview.savedModels || [];
  if(!models.length) return `<div class="notice warn">No calibration models yet.</div>`;

  const baseOpts = models.map(m =>
    `<option value="${esc(m.id)}"${m.id===sreview.calBaseId?" selected":""}>
      #${m.number} ${esc(m.name || "—")}${m.active ? " (active)" : ""}</option>`).join("");
  let content = `<div class="field" style="max-width:360px"><label>Base model</label>
      <select onchange="sreviewSelectBaseModel(this.value)">${baseOpts}</select></div>
    <div class="hint muted">The base model's own trend (beta/alpha) is held fixed — only
      safari_offset is fit here. Metronome Compass's Calibrate Model never sees this value.</div>
    <div class="field check"><input type="checkbox" id="sr-cal-per-advance"
        ${sreview.calPerAdvance ? "checked" : ""}
        onchange="sreviewToggleCalOption('calPerAdvance', this.checked)">
      <label for="sr-cal-per-advance" style="margin:0">Fit a per-advance offset
        (safari_offset_per_advance)</label></div>
    <div class="hint muted" style="margin:-4px 0 8px">Tests whether the number of Seed A
      advances shifts the landing frame. Off = one flat offset for every run. Needs runs that
      recorded an advance count, with different counts between them — the slope gets multiplied
      by your key-seed advances at predict time, so its uncertainty is reported alongside it.</div>
    <div class="field check"><input type="checkbox" id="sr-cal-safari-jitter"
        ${sreview.calSafariJitter ? "checked" : ""}
        onchange="sreviewToggleCalOption('calSafariJitter', this.checked)">
      <label for="sr-cal-safari-jitter" style="margin:0">Use the safari runs' own spread for
        the safari landing jitter (safari_jitter_c)</label></div>
    <div class="hint muted" style="margin:-4px 0 8px">Off = safari scoring uses the jitter
      measured on the <em>metronome</em> path. On = it uses how much these safari runs actually
      scattered, which widens or narrows candidate windows and capture probabilities to
      match.</div>`;

  const pv = sreview.calPreview;
  if(!pv){
    content += `<div class="notice warn" style="margin-top:12px">No fittable safari runs yet —
        need runs with a confident Seed B and Seed A frame identified, after exclusions.</div>`;
  } else {
    const base = models.find(m => m.id === sreview.calBaseId);
    const baseStats = base?.stats?.linear || base?.artifact?.models?.linear;
    const s = pv.stats.linear;
    const f2 = (v) => v == null ? "—" : Number(v).toFixed(4);
    const row = (label, key, fmt) => `<tr><td>${label}</td>
      <td>${baseStats ? fmt(baseStats[key]) : "—"}</td><td>${fmt(s[key])}</td></tr>`;
    content += `
      <div class="info-line" style="margin-top:12px">safari: ${pv.n_safari_input} run(s)
        (${pv.n_safari_pre_excluded} excluded before fitting) · ${pv.n_safari_fit} used in the fit
        ${pv.n_safari_fit===0 ? "— save some from New Run to fit this" : ""}</div>
      <div class="candtable" style="max-height:none"><table><thead><tr>
          <th title="A fitted calibration-model parameter.">parameter</th><th title="The value in the base model you chose, held fixed except for the safari fields.">base model</th><th title="The value this re-fit would save, if you keep it.">new preview</th></tr></thead>
        <tbody>
          ${row("safari_offset (frames)", "safari_offset", f2)}
          ${row("safari_offset_n", "safari_offset_n", (v)=>v??"—")}
          ${row("safari_offset_std", "safari_offset_std", f2)}
          ${sreview.calPerAdvance ? row("safari_offset_per_advance (frames/advance)",
              "safari_offset_per_advance", f2) : ""}
          ${sreview.calSafariJitter ? row("safari_jitter_c", "safari_jitter_c", f2) : ""}
        </tbody></table></div>
      ${_sreviewPerAdvanceNote(pv)}
      ${!pv.changed ? `<div class="notice" style="margin-top:12px">No parameters would change
          from the base model — nothing to save.</div>` : ""}
      <form class="panel" style="margin-top:14px" onsubmit="return sreviewSaveSafariModel(event)">
        <div class="grid2">
          <div class="field"><label>Name (optional)</label><input name="name" placeholder="e.g. safari offset v2"></div>
          <div class="field check" style="align-items:end"><input type="checkbox" name="make_active" id="sr-cal-active" checked>
            <label for="sr-cal-active" style="margin:0">Make this the active model</label></div>
        </div>
        <div class="actions"><button class="btn primary" type="submit" ${pv.changed ? "" : "disabled"}>Save new model</button></div>
      </form>`;
  }

  const savedHeader = `<div class="head" style="margin-top:20px;margin-bottom:12px">
      <div class="section-label" style="margin:0">Saved models</div>
      <button class="btn small" onclick="sreviewImportCalibrationModel()">Import model</button></div>`;
  const savedList = `<div class="candtable" style="max-height:none"><table><thead><tr>
        <th title="Model number within this profile, in the order they were saved.">#</th><th title="The name you gave this saved model.">name</th><th title="When this model was fit and saved.">saved</th><th title="The model every tool in this profile currently scores against.">active</th><th></th></tr></thead>
      <tbody>${models.map(m => `<tr>
        <td>${m.number}</td><td>${esc(m.name || "—")}</td>
        <td>${esc((m.created_at||"").replace("T"," "))}</td>
        <td>${m.active ? `<span class="badge ok">active</span>` : ""}</td>
        <td style="text-align:right;white-space:nowrap">
          ${!m.active ? `<button class="btn small" onclick="sreviewActivateModel('${esc(m.id)}')">Make active</button>` : ""}
          <button class="btn small" onclick="exportCalibrationModel('${esc(m.id)}')">Export</button>
          <button class="btn small danger" onclick="sreviewDeleteCalModel('${esc(m.id)}')">Delete</button>
        </td></tr>`).join("")}</tbody></table></div>`;
  return content + savedHeader + savedList;
}

function exportProfile(id){
  openModal(`<h3>Export profile bundle</h3>
    <p class="muted">Includes expeditions, charts, targets, calibration models, and runs.</p>
    <div class="field check"><input type="checkbox" id="exp-incl-excl" checked>
      <label for="exp-incl-excl" style="margin:0">Include manually-excluded runs</label></div>

    <div class="actions">
      <button class="btn primary" onclick="exportProfileConfirmed('${esc(id)}')">Export</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
}
async function exportProfileConfirmed(id){
  const includeExcluded = $("exp-incl-excl").checked;
  closeModal();
  const res = await api("export_profile_bundle_to_file", id, includeExcluded);
  if(res.saved) toast("Exported to " + res.path);
}

let _pendingImportEnvelope = null;  // stashed here, never embedded in HTML — avoids quoting

async function importProfile(){
  const res = await api("import_profile_bundle_from_file");
  if(res.collision){
    _pendingImportEnvelope = res.envelope;
    openModal(`<h3>Profile already exists</h3>
      <p>A profile named "${esc(res.existing_name)}" is already here. Import as…</p>
      <div class="actions">
        <button class="btn primary" onclick="importProfileResolve('new')">A new separate profile</button>
        <button class="btn" onclick="importProfileResolve('merge')">Merge into the existing one</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>`);
    return;
  }
  if(res.imported) importProfileDone(res);
}
async function importProfileResolve(onCollision){
  const res = await api("import_profile_bundle_resolve", _pendingImportEnvelope, onCollision);
  _pendingImportEnvelope = null;
  closeModal();
  importProfileDone(res);
}
function importProfileDone(res){
  const c = res.counts;
  toast(`Imported "${res.profile_name || "profile"}"${res.merged ? " (merged)" : ""} — ` +
    `${c.expeditions} expedition(s), ${c.charts} chart(s), ${c.targets} target(s), ` +
    `${c.runs} run(s), ${c.calibration_models} model(s)`);
  renderProfiles();
}

async function exportExpedition(id){
  const res = await api("export_expedition_to_file", id);
  if(res.saved) toast("Exported to " + res.path);
}

let _pendingImportProfileId = null;

async function importExpeditionInto(profileId){
  const res = await api("import_expedition_from_file", profileId);
  if(res.collision){
    _pendingImportEnvelope = res.envelope;
    _pendingImportProfileId = profileId;
    openModal(`<h3>Expedition already exists</h3>
      <p>An expedition named "${esc(res.existing_name)}" already exists in this profile. Import as…</p>
      <div class="actions">
        <button class="btn primary" onclick="importExpeditionResolve('copy')">A separate copy</button>
        <button class="btn" onclick="importExpeditionResolve('replace')">Replace it</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>`);
    return;
  }
  if(res.imported){
    toast(`Imported "${res.expedition_name}" — ${res.counts.charts} chart(s), ${res.counts.targets} target(s)`);
    // Open what was just imported, not the profile it landed in (round 15 feedback) — you
    // asked for this expedition, so that's where you should end up.
    openExpeditionHome(res.expedition_id);
  }
}
async function importExpeditionResolve(onCollision){
  const res = await api("import_expedition_resolve", _pendingImportProfileId, _pendingImportEnvelope, onCollision);
  const pid = _pendingImportProfileId;
  _pendingImportEnvelope = null; _pendingImportProfileId = null;
  closeModal();
  toast(`Imported expedition — ${res.counts.charts} chart(s), ${res.counts.targets} target(s)`);
  if(res.expedition_id) openExpeditionHome(res.expedition_id); else openProfile(pid);
}

// Deleting a profile deletes its OWN directly-owned data (runs, calibration models) but
// NOT its expeditions (round 13 feedback) -- delete_profile refuses while any exist, so this
// shows a "delete those first" notice instead of a delete-confirmation when that's the case.
// The confirmation (when it does apply) names exactly what goes with it, fetched fresh so it
// can't go stale between opening the page and confirming.
async function confirmDeleteProfile(id, name){
  const s = await api("profile_delete_summary", id);
  if(s.expeditions > 0){
    // Deleting them isn't the only way out — an expedition can be MOVED to another profile
    // instead (round 15 feedback), so offer that here rather than only naming the blockers.
    const movable = s.other_profiles || [];
    const rows = (s.expedition_list || []).map(e => `<tr>
        <td>${esc(e.name)}</td>
        <td style="text-align:right">${movable.length
          ? `<select id="move-exp-${esc(e.id)}" style="max-width:190px">${movable.map(p =>
              `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select>
             <button class="btn small" onclick="moveExpeditionTo('${esc(e.id)}','${esc(id)}')">Move</button>`
          : `<span class="muted">no other profile to move it to</span>`}</td>
      </tr>`).join("");
    openModal(`<h3>Can't delete "${esc(name)}" yet</h3>
      <p class="muted">This profile still has ${s.expeditions} expedition(s). Deleting the
        profile won't delete them — so either delete each one (its own Delete button is on its
        Configure page) or move it to another profile, then delete this profile.</p>
      <div class="candtable" style="max-height:260px"><table><thead><tr>
          <th title="Expeditions still assigned to this profile.">expedition</th>
          <th title="Reassign this expedition to a different profile. Its charts and targets go with it; runs and calibration models stay with their own profile."
              style="text-align:right">move to</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
      <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`, true);
    return;
  }
  openModal(`<h3>Delete "${esc(name)}"?</h3>
    <p class="muted">This permanently deletes this profile and everything it owns:</p>
    <ul class="muted">
      <li>${s.runs} saved run(s)</li>
      <li>${s.calibration_models} calibration model(s)</li>
      <li>${s.metronome_users} metronome user(s)</li>
    </ul>
    <p class="muted"><b>This cannot be undone.</b></p>
    <div class="actions">
      <button class="btn danger" onclick="deleteProfileConfirmed('${esc(id)}')">Delete permanently</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
}
// Reassigning an expedition out of a profile that's being deleted. Re-opens the same prompt
// so the remaining blockers (and whether any are left) are always current.
async function moveExpeditionTo(expeditionId, fromProfileId){
  const sel = $(`move-exp-${expeditionId}`);
  if(!sel) return;
  const target = sel.value;
  await api("move_expedition", expeditionId, target);
  closeModal();
  toast("Expedition moved.");
  const p = await api("get_profile", fromProfileId);
  confirmDeleteProfile(fromProfileId, p.name);
}

async function deleteProfileConfirmed(id){
  await api("delete_profile", id);
  closeModal();
  toast("Profile deleted.");
  setView("profiles");
}

async function editProfile(id){
  profileForm(await api("get_profile", id));
}

// existing: a profile doc when editing settings after creation (round 13 feedback), else
// null (create).
function profileForm(existing){
  const editing = !!existing;
  mount(`<div class="head"><h2>${editing ? "Profile settings" : "New profile"}</h2></div>
    <form class="panel" onsubmit="return saveProfile(event, ${editing ? `'${esc(existing.id)}'` : "null"})">
      <div class="field"><label>Name</label>
        <input name="name" required value="${esc(existing?.name || "")}" placeholder="SoulSilver — DS Lite">
        <div class="hint">A console + cartridge identity. Models/runs are shared across its expeditions.</div></div>
      <div class="grid2">
        <div class="field"><label>Trainer name</label>
          <input name="trainer_name" value="${esc(existing?.trainer_name || "")}" placeholder="Testare"></div>
        <div class="field"><label>Version</label><select name="version">
          <option value=""${existing?.version?"":" selected"}>—</option>
          <option${existing?.version==="HeartGold"?" selected":""}>HeartGold</option>
          <option${existing?.version==="SoulSilver"?" selected":""}>SoulSilver</option></select></div>
      </div>
      <div class="field"><label>Console note</label>
        <input name="console" value="${esc(existing?.console || "")}" placeholder="original DS Lite">
        <div class="hint">Playing this cartridge on a different console may shift timing — use a separate profile then.</div></div>
      <div class="actions">
        <button class="btn primary" type="submit">${editing ? "Save" : "Create"}</button>
        <button class="btn" type="button" onclick="${editing
          ? `openProfile('${esc(existing.id)}')` : `setView('profiles')`}">Cancel</button>
      </div>
    </form>`);
}

async function saveProfile(ev, existingId){
  ev.preventDefault();
  const f = ev.target;
  const fields = {
    name: f.name.value, trainer_name: f.trainer_name.value.trim(),
    version: f.version.value, console: f.console.value.trim() };
  if(existingId){
    await api("update_profile", existingId, fields);
    openProfile(existingId);
  } else {
    const p = await api("create_profile", fields);
    openProfile(p.id);
  }
  return false;
}

async function showUserWarnings(profileId, userId){
  const p = await api("get_profile", profileId);
  const u = p.metronome_users.find(x => x.id === userId);
  if(!u) return;
  const hardErrors = u.hard_errors || [];
  openModal(`<h3>${esc(u.name)}</h3>
    ${hardErrors.length ? `<div class="notice danger">Cannot be used in Metronome Compass:
        <ul>${hardErrors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    ${u.warnings.length ? `<div class="notice warn">You might experience more errors in
        metronome compass: <ul>${u.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
}

// Names don't need to be unique (clayton-b42.9.7) -- the id is the real key everywhere
// (runs reference metronome_user_id) -- but a same-named pair reads ambiguously in a list
// or dropdown, so disambiguate FOR DISPLAY ONLY by appending "#<id>" when a collision
// actually exists among the given users.
function _mUserLabel(user, allUsers){
  const collides = allUsers.filter(u => u.name === user.name).length > 1;
  return collides ? `${user.name}#${user.id}` : user.name;
}

let _mUsersSpecies = [];

async function openProfile(id){
  const [p, species] = await Promise.all([
    api("get_profile", id), api("list_metronome_species")]);
  _mUsersSpecies = species;
  const users = p.metronome_users.length === 0
    ? `<div class="empty">No metronome users yet. Add the Pokémon you calibrate with
        (P0: Chansey w/ Natural Cure, holding a Lagging Tail, knowing Metronome).</div>`
    : `<table><thead><tr><th title="This user's number within the profile.">id</th><th title="The name you gave this metronome user.">Name</th><th title="The species — determines which Metronome outcomes are possible.">Species</th><th title="Whether this user can be selected in Metronome Compass, and any warnings about it.">Status</th><th></th></tr></thead>
      <tbody>` + p.metronome_users.map(u => {
        const blocked = u.hard_errors && u.hard_errors.length > 0;
        const allIssues = [...(u.hard_errors||[]), ...(u.warnings||[])];
        const badge = u.is_suitable ? `<span class="badge ok">suitable</span>`
          : blocked
            ? `<span class="badge danger" style="cursor:pointer" title="${esc(allIssues.join('; '))}"
                onclick="showUserWarnings('${esc(p.id)}',${u.id})">cannot be used in Metronome Compass</span>`
            : `<span class="badge warn" style="cursor:pointer" title="${esc(allIssues.join('; '))}"
                onclick="showUserWarnings('${esc(p.id)}',${u.id})">${esc(u.warnings.length)} warning(s)</span>`;
        return `<tr><td>${u.id}</td><td>${esc(_mUserLabel(u, p.metronome_users))}</td><td>${esc(u.species)}</td>
          <td>${badge}</td>
          <td style="text-align:right"><button class="btn small danger"
            onclick="removeUser('${esc(p.id)}',${u.id})">Remove</button></td></tr>`;
      }).join("")
      + `</tbody></table>`;

  const speciesOpts = species.map(s =>
    `<option value="${esc(s.name)}"${s.name==="Chansey"?" selected":""}>${esc(s.name)}</option>`).join("");

  mount(`<div class="head"><h2>${esc(p.name)}</h2>
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="editProfile('${esc(p.id)}')">Settings</button>
        <button class="btn" onclick="exportProfile('${esc(p.id)}')">Export bundle</button>
        <button class="btn" onclick="importExpeditionInto('${esc(p.id)}')">Import expedition</button>
        <button class="btn danger" onclick="confirmDeleteProfile('${esc(p.id)}','${esc(p.name)}')">Delete</button>
        <button class="btn" onclick="setView('profiles')">← All profiles</button>
      </div></div>
    <div class="muted">${esc(p.trainer_name || "—")}${p.version ? " · " + esc(p.version) : ""}${p.console ? " · " + esc(p.console) : ""}</div>

    <div class="section-label">Metronome users</div>
    ${users}

    <div class="section-label">Add a metronome user</div>
    <form class="panel" id="add-user-form" oninput="updateUserWarnings()"
        onsubmit="return addUser(event,'${esc(p.id)}')">
      <div class="grid2">
        <div class="field"><label>Name</label><input name="name" required placeholder="Chansey 1"></div>
        <div class="field"><label>Species</label>
          <select name="species" id="uf-species" onchange="onSpeciesChange()">${speciesOpts}</select></div>
        <div class="field"><label>Ability</label><select name="ability" id="uf-ability"></select></div>
        <div class="field"><label>Level</label><input name="level" type="number" min="1" max="100"></div>
        <div class="field"><label>Gender</label>
          <div class="radios">
            <label class="radio"><input type="radio" name="gender" value="female" id="uf-gender-f"> female</label>
            <label class="radio"><input type="radio" name="gender" value="male" id="uf-gender-m"> male</label>
            <label class="radio"><input type="radio" name="gender" value="" id="uf-gender-n" checked> —</label>
          </div></div>
      </div>
      <div class="section-label" style="margin-top:14px">Moveset
        <span class="muted" style="text-transform:none;font-weight:400">— order matters,
          enter moves in the same slot order (1-4) as the real Pokémon actually has them</span></div>
      <div class="grid4">
        <div class="field"><label>Move 1</label><select name="move1" class="uf-move"></select></div>
        <div class="field"><label>Move 2</label><select name="move2" class="uf-move"></select></div>
        <div class="field"><label>Move 3</label><select name="move3" class="uf-move"></select></div>
        <div class="field"><label>Move 4</label><select name="move4" class="uf-move"></select></div>
      </div>
      <div class="field check"><input type="checkbox" name="lagging_tail" id="lt" checked>
        <label for="lt" style="margin:0">Holding a Lagging Tail</label></div>
      <div class="notice danger" id="mw-errors" hidden></div>
      <div class="notice warn" id="mw-warnings" hidden></div>
      <div class="actions"><button class="btn primary" type="submit" id="uf-submit">Add user</button></div>
      <div class="hint muted">Metronome users can't be edited after adding — to change one, add a new user and remove the old.</div>
    </form>`);
  onSpeciesChange();
}

function _speciesData(name){
  return _mUsersSpecies.find(s => s.name === name) || null;
}

// Cascades everything the chosen species determines: which abilities/moves are offered,
// and which gender options are even possible (clayton-b42.9.7's worked example: Mew
// auto-selects genderless and disables male/female; Chansey disables male/genderless;
// a "both" species like Togepi just disables genderless and leaves male/female open).
function onSpeciesChange(){
  const s = _speciesData($("uf-species").value) || {abilities: ["Natural Cure"], moves: ["Metronome"], gender: "both"};

  const abilitySel = $("uf-ability");
  const prevAbility = abilitySel.value;
  abilitySel.innerHTML = s.abilities.map(a => `<option${a===prevAbility?" selected":""}>${esc(a)}</option>`).join("");

  document.querySelectorAll(".uf-move").forEach(sel => {
    const prev = sel.value;
    const opts = `<option value="">—</option>` + s.moves.map(m =>
      `<option${m===prev?" selected":""}>${esc(m)}</option>`).join("");
    sel.innerHTML = opts;
    if(!s.moves.includes(prev)) sel.value = "";
  });
  // Default the moveset to Metronome in slot 1 the first time a species is chosen with
  // nothing picked yet (every offered species can learn it — see claytonlib.metronome_species).
  const move1 = document.querySelector('select[name="move1"]');
  if(move1 && !move1.value && s.moves.includes("Metronome")) move1.value = "Metronome";

  const female = $("uf-gender-f"), male = $("uf-gender-m"), none = $("uf-gender-n");
  female.disabled = male.disabled = none.disabled = false;
  if(s.gender === "female_only"){
    male.disabled = none.disabled = true;
    female.checked = true;
  } else if(s.gender === "male_only"){
    female.disabled = none.disabled = true;
    male.checked = true;
  } else if(s.gender === "genderless"){
    female.disabled = male.disabled = true;
    none.checked = true;
  } else {
    none.disabled = true;
    if(none.checked) female.checked = true;  // was on "—" from a previous genderless pick
  }

  updateUserWarnings();
}

function _readUserForm(){
  const f = $("add-user-form");
  const moveset = ["move1", "move2", "move3", "move4"]
    .map(n => f[n].value.trim()).filter(Boolean);
  return {
    name: f.name.value,
    species: f.species.value,
    ability: f.ability.value || null,
    level: numOrNull(f.level.value),
    gender: f.gender.value || null,
    moveset,
    lagging_tail: f.lagging_tail.checked,
  };
}

async function updateUserWarnings(){
  const errBox = $("mw-errors"), warnBox = $("mw-warnings");
  if(!errBox) return;
  const fields = _readUserForm();
  const [errors, warnings] = await Promise.all([
    api("metronome_user_hard_errors", fields), api("metronome_user_warnings", fields)]);

  // Creating a user is NEVER blocked here (clayton-b42.10.2) — these are both just
  // heads-up notices; hard_errors specifically means "won't be selectable in Metronome
  // Compass", not "can't be saved". No "...yet" (round 10 feedback) -- that framing
  // isn't accurate for every hard error (not knowing Metronome never gets supported).
  if(errors.length){
    errBox.innerHTML = `This metronome user cannot be used in Metronome Compass:
      <ul>${errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;
    errBox.hidden = false;
  } else {
    errBox.hidden = true;
  }

  if(warnings.length){
    warnBox.innerHTML = `You might experience more errors in metronome compass:
      <ul>${warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`;
    warnBox.hidden = false;
  } else {
    warnBox.hidden = true;
  }
}

async function addUser(ev, profileId){
  ev.preventDefault();
  const res = await api("add_metronome_user", profileId, _readUserForm());
  if(res.hard_errors && res.hard_errors.length)
    toast("Added, but cannot be used in Metronome Compass: " + res.hard_errors.join("; "));
  else if(res.warnings && res.warnings.length)
    toast("Added, but: " + res.warnings.join("; "));
  openProfile(profileId);
  return false;
}

async function removeUser(profileId, userId){
  if(!confirm("Remove this metronome user? Runs performed with it will no longer be able to "
    + "display its information.")) return;
  await api("remove_metronome_user", profileId, userId);
  openProfile(profileId);
}

// --- boot -----------------------------------------------------------------
let started = false;
function boot(){ if(started) return; started = true; setView("expeditions"); }
window.addEventListener("pywebviewready", boot);
if(window.pywebview) boot();
</script>
