name: Windows build

# Builds the Clayton desktop app on Windows and uploads it as a downloadable artifact.
# Trigger by hand from the Actions tab ("Run workflow"), or by pushing a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pywebview pyinstaller

      # Catches an import-level break before spending minutes on the freeze. The GUI can't
      # open on a CI runner, so this only proves the modules load and the data files resolve.
      - name: Smoke-test the imports
        run: python -c "import app.main, app.facade, claytonlib; print('imports OK')"

      - name: Build exe
        run: pyinstaller packaging/clayton.spec

      # The spec builds ONE FILE: dist/Clayton.exe, self-contained, nothing beside it.
      - name: Check the build landed where we expect
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Clayton.exe")) {
            Write-Host "Expected dist/Clayton.exe. Contents of dist:"
            Get-ChildItem -Recurse dist | Select-Object -First 40 | Format-Table FullName
            exit 1
          }
          Write-Host "Built:" (Get-Item "dist/Clayton.exe").Length "bytes"

      # A one-file build should sidestep the Mark-of-the-Web problem that broke the folder
      # build: its DLLs are unpacked to a temp directory at launch by the bootloader, and
      # files a process writes carry no zone tag. Windows may still show a SmartScreen prompt
      # for an unsigned downloaded exe, which is a different thing and just needs "Run anyway".
      - name: Add a read-me to the artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item dist/Clayton.exe artifact/
          @'
          Clayton for Windows
          ===================

          Clayton.exe is self-contained. Put it anywhere and run it.

          First launch may take a few seconds: the app unpacks itself into a temporary
          folder each time it starts. That is the trade for being a single file.

          Windows will probably warn that it does not recognise the publisher - the build
          is unsigned. Choose "More info" then "Run anyway".

          If it refuses to start with an error mentioning Python.Runtime.dll, the download
          is still marked as blocked. In PowerShell, in this folder:

              Unblock-File .\Clayton.exe

          Your data is kept in %LOCALAPPDATA%\Clayton, separate from the executable, so
          replacing Clayton.exe with a newer build never touches your profiles or runs.
          '@ | Set-Content -Path artifact/READ-ME-FIRST.txt -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clayton-windows
          path: artifact
          if-no-files-found: error
